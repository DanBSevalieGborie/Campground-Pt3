plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // Lets us hand a whole park or campground to its detail screen with @Parcelize
    id 'kotlin-parcelize'
}

// The NPS API key lives in apikey.properties in the project root (the lab's setup):
//     API_KEY=your_key_here
// apikey.properties is git-ignored so the key is never committed. local.properties
// works too. If neither has a key, the app falls back to NPS's shared DEMO_KEY,
// which works but is rate-limited — so a missing file no longer breaks Gradle sync.
def readApiKey = { String fileName ->
    def file = rootProject.file(fileName)
    if (!file.exists()) return null
    def props = new Properties()
    file.withInputStream { props.load(it) }
    def key = props.getProperty('API_KEY') ?: props.getProperty('NPS_API_KEY')
    return key?.trim()?.replaceAll('^"|"$', '') ?: null
}
def npsApiKey = readApiKey('apikey.properties') ?: readApiKey('local.properties') ?: 'DEMO_KEY'

android {
    namespace 'com.codepath.lab6'
    compileSdk 36

    defaultConfig {
        applicationId "com.codepath.campground"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "API_KEY", "\"${npsApiKey}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // ViewModels keep each tab's data alive across rotations and tab switches
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'

    // Networking - CodePath's wrapper around OkHttp
    implementation 'com.codepath.libraries:asynchttpclient:2.2.0'

    // Image loading from URLs
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Unit tests run on the JVM, where Android's org.json is only a stub
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
